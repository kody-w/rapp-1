name: Documentation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Protocol conformance (spec floor is stdlib-only, any modern Python)
        run: python3 conformance.py
      - name: Specification chain and materialized view
        run: |
          python3 -m unittest anchor.test_spec_chain
          python3 anchor/materialize_spec.py --offline --check SPEC.md
          python3 anchor/update_anchor.py
          git diff --exit-code -- anchor
      - name: Operational profile conformance
        run: python3 operations_conformance.py
      - name: Committed RAPP artifacts pass the repo's own linter (red oracle)
        run: python3 rapp_check.py .
      - name: Front doors name the chain head (index.html and guide must not outlive the anchor)
        run: |
          rev=$(python3 -c 'import json; print(json.load(open("anchor/orient.json"))["spec"]["revision"])')
          echo "chain head: $rev"
          bad=0
          for f in index.html guide/index.html; do
            for label in $(grep -o 'RAPP rev-[0-9]*' "$f" | sed 's/^RAPP //' | sort -u); do
              if [ "$label" != "$rev" ]; then echo "::error file=$f::stale revision label 'RAPP $label' (chain head is $rev)"; bad=1; fi
            done
          done
          exit $bad
      - name: The Internet-Draft renders the chain head (no stale archival copy)
        run: python3 ietf/make_draft.py 00 --check
      - name: Implementer vectors are derived from rapp.py, never hand-edited
        run: python3 conformance/make_vectors.py --check
      - name: Reference/agent primitive parity (one canonicalizer, enforced)
        run: python3 parity_check.py
      - name: Run every example end to end
        run: |
          for f in examples/0*.py; do
            echo "== $f"
            python3 "$f"
          done

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Committed PDF must not lag the book source
        run: |
          pdf_commit=$(git rev-list -1 HEAD -- book/the-rapp-programming-language.pdf)
          src_commit=$(git rev-list -1 HEAD -- 'book/*.md' ':!book/README.md' 'book/assets' '_layouts/book-print.html')
          echo "pdf:  $pdf_commit"
          echo "src:  $src_commit"
          if [ "$pdf_commit" != "$src_commit" ] && ! git merge-base --is-ancestor "$src_commit" "$pdf_commit"; then
            echo "::error::book source changed after the committed PDF was last rebuilt — run book/build-pdf.sh and commit the result"
            exit 1
          fi
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation tools
        run: |
          gem install jekyll -v 4.4.1 --no-document
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Validate generated HTML, DOM, print render, and PDF
        run: ./book/test-docs.sh
      - name: Run protocol conformance
        run: python3 conformance.py
      - name: Upload print regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-evidence
          path: |
            .book-build/tests/print-a.png
            .book-build/tests/generated.pdf
            book/the-rapp-programming-language.pdf
          if-no-files-found: error

  dco:
    # Provenance for every line an outside contributor lands in the standard: the
    # Developer Certificate of Origin (developercertificate.org, v1.1). Runs only on
    # pull requests from forks; the owner's own branches are already attributed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every commit carries a Signed-off-by line (git commit -s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate \
            --jq '.[] | select((.commit.message | split("\n") | map(test("^Signed-off-by: .+ <.+@.+>$")) | any) | not) | .sha[0:12] + "  " + (.commit.message | split("\n")[0])')
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::commits without a Signed-off-by line — certify DCO 1.1 with 'git commit -s' (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "all commits signed off"
