name: Grail conformance

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the one Grail pin
        id: kernel
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("conformance/grail/kernel.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kody-w/rapp-installer
          ref: ${{ steps.kernel.outputs.commit }}
          path: grail-source
      - name: Install pinned Grail requirements
        run: python3 -m pip install -r grail-source/rapp_brainstem/requirements.txt
      - name: Scenario inventory
        run: python3 -m unittest discover -s conformance/grail -p 'test_*.py'
      - name: Pinned Grail matches itself
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: |
          python3 conformance/grail/run.py \
            --candidate "grail:${{ github.workspace }}/grail-source/rapp_brainstem"
