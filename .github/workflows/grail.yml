name: Grail conformance

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the one Grail pin
        id: kernel
        run: |
          echo "sha=$(python3 -c 'import json; print(json.load(open("conformance/grail/kernel.json"))["sha"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kody-w/rapp-installer
          ref: ${{ steps.kernel.outputs.sha }}
          path: grail-source
      - name: Install pinned Grail requirements
        run: python3 -m pip install -r grail-source/rapp_brainstem/requirements.txt coverage
      - name: Install signature verification dependency
        run: python3 -m pip install cryptography
      - name: Device-local succession conformance
        run: python3 succession_conformance.py protocols/examples/succession-lifecycle.json
      - name: Scenario inventory
        run: python3 -m unittest discover -s conformance/grail -p 'test_*.py'
      - name: Vectors match the scenarios
        run: python3 conformance/grail/export_vectors.py --check
      - name: Pinned Grail matches itself
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: |
          python3 conformance/grail/run.py \
            --candidate "grail:${{ github.workspace }}/grail-source/rapp_brainstem"
      - name: Expected answers match the oracle
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: python3 conformance/grail/make_expected.py --check
      - name: Grail layers keep the wire identical
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          layers_dir=$(mktemp -d)
          trap 'rm -f "$layers_dir/grail_layers.py" "$layers_dir/hologram.py" "$layers_dir/shape_lens.py" "$layers_dir/rapp.py" "$layers_dir/responses_models.py"; rmdir "$layers_dir"' EXIT
          for module in grail_layers hologram shape_lens; do
            curl --fail --silent --show-error --retry 3 \
              "https://kody-w.github.io/grail-layers/$module.py" \
              --output "$layers_dir/$module.py"
          done
          cp rapp.py "$layers_dir/rapp.py"
          curl --fail --silent --show-error --retry 3 \
            https://kody-w.github.io/RAR/stacks/grail-layers/responses_models.py \
            --output "$layers_dir/responses_models.py"
          GRAIL_LAYERS_SUPERVISOR="$layers_dir/grail_layers.py" \
            GRAIL_LAYERS_DIR="$layers_dir" \
            python3 conformance/grail/run.py --candidate layers:responses_models
      - name: The memory promise survives a restart
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: python3 conformance/grail/promise_memory.py
      - name: Suite has teeth (mutants)
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: python3 conformance/grail/mutants.py
      - name: What the suite does not reach (coverage)
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail-source/rapp_brainstem
        run: python3 conformance/grail/coverage_run.py
